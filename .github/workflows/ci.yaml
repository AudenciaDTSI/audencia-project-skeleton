---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build Docker images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: docker compose up --wait --no-build
      # Ports dev définis dans compose.override.yaml (8000/8443) ; / sert la page d'accueil du skeleton
      - name: Check HTTPS reachability
        run: curl -v --insecure --fail-with-body https://localhost:8443
      # Uncomment if Doctrine ORM is installed
      # - name: Create test database
      #   run: docker compose exec -T php bin/console -e test doctrine:database:create
      # Uncomment if Doctrine Migrations is installed
      # - name: Run migrations
      #   run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
      - name: PHP-CS-Fixer
        run: docker compose exec -T php vendor/bin/php-cs-fixer check --diff --show-progress=none
      - name: PHPStan
        run: docker compose exec -T php vendor/bin/phpstan analyse --no-progress --error-format=github
      - name: Run PHPUnit
        run: docker compose exec -T php vendor/bin/phpunit
      # Uncomment if Doctrine ORM is installed
      # - name: Doctrine Schema Validator
      #   run: docker compose exec -T php bin/console -e test doctrine:schema:validate
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint Code Base
        uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_CHECKOV: false
          VALIDATE_TRIVY: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          VALIDATE_PYTHON_BLACK: false
          # PHP est déjà contrôlé par make qa dans l'image du projet (PHP 8.5) ;
          # les linters PHP de super-linter tournent sur leur propre PHP et échouent au composer install
          VALIDATE_PHP_BUILTIN: false
          VALIDATE_PHP_PHPCS: false
          VALIDATE_PHP_PHPSTAN: false
          VALIDATE_PHP_PSALM: false
          # Correcteurs anglais, inadaptés à un projet rédigé en français
          VALIDATE_NATURAL_LANGUAGE: false
          VALIDATE_SPELL_CODESPELL: false
          # Faux positifs : format .env de Symfony, détection de copier-coller
          VALIDATE_ENV: false
          VALIDATE_JSCPD: false
          # Garde le style des fichiers YAML générés par les recettes Symfony (yamllint reste actif)
          VALIDATE_YAML_PRETTIER: false
